name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ai-service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m tests.evaluate

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: mvn -B verify

  flutter:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: flutter_app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create . --platforms=android,ios
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  docker:
    runs-on: ubuntu-latest
    needs: [ai-service, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t finance-backend backend
      - run: docker build -t finance-ai ai-service
