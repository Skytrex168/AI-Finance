server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance}
    username: ${DB_USER:finance}
    password: ${DB_PASSWORD:finance}
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  jwt:
    secret: ${JWT_SECRET}            # required, >= 32 chars, never commit
    access-minutes: 15
    refresh-days: 14
  ai:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    key: ${AI_INTERNAL_KEY:}
  seed-demo: ${SEED_DEMO:true}
